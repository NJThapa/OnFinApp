server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/onfinapp}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
# Give up waiting for a database connection after 5 seconds (the default is 30) and answer 503.
spring.datasource.hikari.connection-timeout=5000

# OIDC resource-server settings. OIDC_JWKS_URI is optional: set it only when the
# issuer URL is not reachable from the API (e.g. inside docker compose).
oidc.issuer=${OIDC_ISSUER:http://localhost:8082/realms/onfinapp}
oidc.audience=${OIDC_AUDIENCE:onfinapp-api}
oidc.jwks-uri=${OIDC_JWKS_URI:}

# Browser origins allowed to call the API (comma-separated). Empty = no cross-origin access.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8090}

# Price data. "mock" generates invented prices from the fixtures in the shared folder; no API key needed.
price.provider=${PRICE_PROVIDER:mock}
# Folder shared by both APIs (app/api/shared): mock fixtures and LLM prompts.
price.shared-dir=${SHARED_DIR:../shared}
price.instrument-sync-interval-hours=${INSTRUMENT_SYNC_INTERVAL_HOURS:24}

# LLM. "mock" answers from fixed rules (app/api/shared/llm/README.md); no API key needed.
llm.provider=${LLM_PROVIDER:mock}
llm.shared-dir=${SHARED_DIR:../shared}
# How long the mock waits before answering, and tickers for which it fails (comma-separated).
llm.mock-delay-ms=${LLM_MOCK_DELAY_MS:1500}
llm.mock-fail-symbols=${LLM_MOCK_FAIL_SYMBOLS:}

# Analyses. An analysis is valid for ttl-hours. A user can queue refresh-limit refreshes in any 24 hours,
# and a refresh is ignored while the analysis is younger than refresh-min-age-minutes. After a failed
# generation none is started on demand for retry-after-minutes.
analysis.ttl-hours=${ANALYSIS_TTL_HOURS:24}
analysis.refresh-limit=${ANALYSIS_REFRESH_LIMIT:5}
analysis.refresh-min-age-minutes=${ANALYSIS_REFRESH_MIN_AGE_MINUTES:60}
analysis.retry-after-minutes=${ANALYSIS_RETRY_AFTER_MINUTES:5}
# The worker runs generation jobs. It polls for jobs queued by the other API; a job running longer than
# job-timeout-seconds is taken to be abandoned and is claimed again.
analysis.worker-enabled=${ANALYSIS_WORKER_ENABLED:true}
analysis.worker-poll-ms=${ANALYSIS_WORKER_POLL_MS:2000}
analysis.job-timeout-seconds=${ANALYSIS_JOB_TIMEOUT_SECONDS:300}

# Maximum number of instruments one user can follow.
watchlist.limit=${WATCHLIST_LIMIT:50}

# Console logs as one JSON object per line (Elastic Common Schema), carrying the correlation ID and,
# when the OpenTelemetry agent is attached, the trace and span IDs.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${OTEL_SERVICE_NAME:onfinapp-api-java}
logging.level.com.onfinapp=${LOG_LEVEL:INFO}
