server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/onfinapp}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# OIDC resource-server settings. OIDC_JWKS_URI is optional: set it only when the
# issuer URL is not reachable from the API (e.g. inside docker compose).
oidc.issuer=${OIDC_ISSUER:http://localhost:8082/realms/onfinapp}
oidc.audience=${OIDC_AUDIENCE:onfinapp-api}
oidc.jwks-uri=${OIDC_JWKS_URI:}

# Browser origins allowed to call the API (comma-separated). Empty = no cross-origin access.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8090}
