server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/onfinapp}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
# Give up waiting for a database connection after 5 seconds (the default is 30) and answer 503.
spring.datasource.hikari.connection-timeout=5000

# OIDC resource-server settings. OIDC_JWKS_URI is optional: set it only when the
# issuer URL is not reachable from the API (e.g. inside docker compose).
oidc.issuer=${OIDC_ISSUER:http://localhost:8082/realms/onfinapp}
oidc.audience=${OIDC_AUDIENCE:onfinapp-api}
oidc.jwks-uri=${OIDC_JWKS_URI:}

# Browser origins allowed to call the API (comma-separated). Empty = no cross-origin access.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8090}

# Price data. "mock" generates invented prices from the fixtures in the shared folder; no API key needed.
price.provider=${PRICE_PROVIDER:mock}
# Folder shared by both APIs (app/api/shared): mock fixtures now, LLM prompts later.
price.shared-dir=${SHARED_DIR:../shared}
price.instrument-sync-interval-hours=${INSTRUMENT_SYNC_INTERVAL_HOURS:24}

# Maximum number of instruments one user can follow.
watchlist.limit=${WATCHLIST_LIMIT:50}

# Console logs as one JSON object per line (Elastic Common Schema), carrying the correlation ID and,
# when the OpenTelemetry agent is attached, the trace and span IDs.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${OTEL_SERVICE_NAME:onfinapp-api-java}
logging.level.com.onfinapp=${LOG_LEVEL:INFO}
