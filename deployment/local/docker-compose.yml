name: app-local

x-oidc: &oidc
  # Issuer as it appears in tokens (the URL the app on the host uses).
  OIDC_ISSUER: http://localhost:8082/realms/onfinapp
  OIDC_AUDIENCE: onfinapp-api
  # Containers cannot reach Keycloak on localhost, so keys are fetched over the compose network.
  OIDC_JWKS_URI: http://keycloak:8080/realms/onfinapp/protocol/openid-connect/certs
  # Browser origins allowed to call the API (the Expo web app). Comma-separated.
  CORS_ALLOWED_ORIGINS: http://localhost:8090

x-shared: &shared
  # Folder both APIs read: mock price fixtures, LLM prompts and schemas.
  - ../../app/api/shared:/shared:ro

x-prices: &prices
  # "mock" generates invented prices from /shared/mock; no API key needed.
  PRICE_PROVIDER: ${PRICE_PROVIDER:-mock}
  SHARED_DIR: /shared
  WATCHLIST_LIMIT: ${WATCHLIST_LIMIT:-50}

x-analysis: &analysis
  # "mock" answers from fixed rules (app/api/shared/llm/README.md); no API key needed.
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  # How long the mock LLM waits before answering, and tickers for which it fails (comma-separated).
  LLM_MOCK_DELAY_MS: ${LLM_MOCK_DELAY_MS:-1500}
  LLM_MOCK_FAIL_SYMBOLS: ${LLM_MOCK_FAIL_SYMBOLS:-}
  # An analysis is valid this long; each user can queue this many refreshes in any 24 hours; a refresh is
  # ignored while the analysis is younger than the minimum age.
  ANALYSIS_TTL_HOURS: ${ANALYSIS_TTL_HOURS:-24}
  ANALYSIS_REFRESH_LIMIT: ${ANALYSIS_REFRESH_LIMIT:-5}
  ANALYSIS_REFRESH_MIN_AGE_MINUTES: ${ANALYSIS_REFRESH_MIN_AGE_MINUTES:-60}
  # After a failed generation, wait this long before one is started on demand again.
  ANALYSIS_RETRY_AFTER_MINUTES: ${ANALYSIS_RETRY_AFTER_MINUTES:-5}

x-telemetry: &telemetry
  # Both APIs send traces, metrics and logs over OTLP to the apm-server container.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://apm-server:8200
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  # Elastic Stack for telemetry, on the free Basic license. Local only: security is off and the data
  # lives in the elasticsearch container, so it is lost when that container is removed.
  # Kibana: http://localhost:5601 (no sign-in) -> Observability -> Applications / Logs.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s"]
      interval: 5s
      timeout: 5s
      retries: 40

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Receives OpenTelemetry (OTLP over HTTP or gRPC, both on port 8200) from the APIs and stores it in Elasticsearch.
  apm-server:
    image: docker.elastic.co/apm/apm-server:9.5.6
    command:
      - --strict.perms=false
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
    ports:
      - "8200:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: onfinapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d onfinapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies app/database/migrations, then exits. Neither API owns the schema.
  migrate:
    image: flyway/flyway:11
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/onfinapp
      FLYWAY_USER: ${DB_USER:-app}
      FLYWAY_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - ../../app/database/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8082
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/onfinapp-realm.json:/opt/keycloak/data/import/onfinapp-realm.json:ro

  api-java:
    build: ../../app/api/java
    environment:
      <<: [*oidc, *prices, *analysis, *telemetry]
      OTEL_SERVICE_NAME: onfinapp-api-java
      # Set to "false" to make this API queue generation jobs without running them.
      ANALYSIS_WORKER_ENABLED: ${JAVA_ANALYSIS_WORKER_ENABLED:-true}
      # The Java agent is attached in the image but switched off by default.
      OTEL_SDK_DISABLED: "false"
      # Copy the correlation ID from the log context onto exported log records.
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: "*"
      DB_URL: jdbc:postgresql://postgres:5432/onfinapp
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
    volumes: *shared
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-dotnet:
    build: ../../app/api/dotnet
    environment:
      <<: [*oidc, *prices, *analysis, *telemetry]
      OTEL_SERVICE_NAME: onfinapp-api-dotnet
      ANALYSIS_WORKER_ENABLED: ${DOTNET_ANALYSIS_WORKER_ENABLED:-true}
      Logging__LogLevel__OnFinApp: ${LOG_LEVEL:-Information}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=onfinapp;Username=${DB_USER:-app};Password=${DB_PASSWORD:-app}
    volumes: *shared
    ports:
      - "8081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
